services:
  - type: web
    name: mlb-simulator-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: PLAKATA_PASSWORD
        sync: false
      - key: ODDSBLAZE_API_KEY
        sync: false
      # Which tabs get backend startup work (models, warmers, pollers). Default in
      # main.py is research,cfb,nhl,upsets; add sim,batch,board,... to turn pages back on.
      # - key: DASH_FEATURES
      #   value: research,cfb,nhl,upsets
